# Carenode fork release: builds the Univer packages Carenode installs as @danmeon/univer-*, checks them, and
# stages them on npm. Tools and flow: carenode/README.md. Upstream workflows stay untouched (and disabled in
# this repository).
#
#   push tag v<upstream>-carenode.<N>  build + layer 1/2 comparison + pack check; N >= 1 also stages the
#                                      tarballs on npm (a maintainer approves them with 2FA). N = 0 is the
#                                      unmodified upstream source and is never published from here.
#   workflow_dispatch (version input)  the same build and checks for comparison only; never publishes.
name: carenode release

on:
    push:
        tags:
            - 'v*-carenode.*'
    workflow_dispatch:
        inputs:
            version:
                description: Fork version to build and compare, e.g. 1.5.2-carenode.0 (a manual run never publishes)
                required: true
                type: string

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

env:
    TURBO_TELEMETRY_DISABLED: '1'
    # Same runtime as upstream's release-npm.yml; each build job fails when the two differ.
    NODE_RUNTIME: node@24.22.1

jobs:
    meta:
        name: version
        if: github.repository == 'DanMeon/univer'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            version: ${{ steps.version.outputs.version }}
            base_tag: ${{ steps.version.outputs.base_tag }}
            publish: ${{ steps.version.outputs.publish }}
        steps:
            - name: Read the fork version
              id: version
              env:
                  EVENT: ${{ github.event_name }}
                  REF_NAME: ${{ github.ref_name }}
                  INPUT_VERSION: ${{ inputs.version }}
              run: |
                  if [[ "$EVENT" == push ]]; then version="${REF_NAME#v}"; else version="$INPUT_VERSION"; fi
                  # Same format as parseForkVersion in carenode/fork.mts.
                  if [[ ! "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-carenode\.(0|[1-9][0-9]*)$ ]]; then
                      echo "::error::'$version' is not <upstream version>-carenode.<N>"
                      exit 1
                  fi
                  publish=false
                  if [[ "$EVENT" == push && "${BASH_REMATCH[2]}" != 0 ]]; then publish=true; fi
                  {
                      echo "version=$version"
                      echo "base_tag=v${BASH_REMATCH[1]}"
                      echo "publish=$publish"
                  } >> "$GITHUB_OUTPUT"
                  echo "version $version, base v${BASH_REMATCH[1]}, stage on npm: $publish" >> "$GITHUB_STEP_SUMMARY"

    upstream-build:
        name: layer 1 (unmodified ${{ needs.meta.outputs.base_tag }} vs official)
        needs: meta
        if: github.repository == 'DanMeon/univer'
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - name: Checkout the upstream tag
              uses: actions/checkout@v7
              with:
                  ref: ${{ needs.meta.outputs.base_tag }}
                  persist-credentials: false

            - name: Take carenode/ from the run's commit
              run: |
                  git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
                  git archive "$GITHUB_SHA" carenode | tar -x -C "$RUNNER_TEMP"
                  echo "TOOLS=$RUNNER_TEMP/carenode" >> "$GITHUB_ENV"
                  echo "WORK=$RUNNER_TEMP/work" >> "$GITHUB_ENV"
                  mkdir -p "$RUNNER_TEMP/work/reports"

            - name: Check the runtime against release-npm.yml
              run: |
                  grep -F -- "runtime: $NODE_RUNTIME" .github/workflows/release-npm.yml

            - name: Install pnpm and Node.js
              uses: pnpm/setup@v3
              with:
                  runtime: ${{ env.NODE_RUNTIME }}
                  install: false

            - name: Install dependencies and build (as release-npm.yml)
              run: |
                  pnpm install --frozen-lockfile
                  pnpm build

            - name: Select and pack
              run: |
                  node "$TOOLS/select-packages.mts" --out "$WORK/reports/selection.json"
                  node "$TOOLS/pack-packages.mts" --selection "$WORK/reports/selection.json" --out "$WORK/upstream"

            - name: Layer 1 - compare with the official tarballs
              run: |
                  node "$TOOLS/compare-official.mts" --mode exact --selection "$WORK/reports/selection.json" \
                      --built "$WORK/upstream" --official "$WORK/official" --report "$WORK/reports/layer1.json" \
                      | tee "$WORK/reports/layer1.txt"
                  tail -n 1 "$WORK/reports/layer1.txt" >> "$GITHUB_STEP_SUMMARY"

            - name: Upload the layer 1 report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: carenode-layer1-${{ needs.meta.outputs.version }}
                  path: ${{ env.WORK }}/reports
                  retention-days: 90
                  if-no-files-found: ignore

    fork-build:
        name: fork build ${{ needs.meta.outputs.version }} (layer 2, pack check)
        needs: meta
        if: github.repository == 'DanMeon/univer'
        runs-on: ubuntu-latest
        timeout-minutes: 45
        env:
            VERSION: ${{ needs.meta.outputs.version }}
            BASE_TAG: ${{ needs.meta.outputs.base_tag }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Fetch the upstream tag (for the changed-file list in each README)
              run: |
                  git fetch --no-tags --depth=1 origin "refs/tags/$BASE_TAG:refs/tags/$BASE_TAG"
                  echo "WORK=$RUNNER_TEMP/work" >> "$GITHUB_ENV"
                  mkdir -p "$RUNNER_TEMP/work/reports"

            - name: Check the runtime against release-npm.yml
              run: |
                  grep -F -- "runtime: $NODE_RUNTIME" .github/workflows/release-npm.yml

            - name: Install pnpm and Node.js
              uses: pnpm/setup@v3
              with:
                  runtime: ${{ env.NODE_RUNTIME }}
                  install: false

            - name: Set the fork version
              run: node carenode/set-version.mts "$VERSION"

            - name: Install dependencies and build (as release-npm.yml)
              run: |
                  pnpm install --frozen-lockfile
                  pnpm build

            - name: Select, rename and pack
              run: |
                  node carenode/select-packages.mts --out "$WORK/reports/selection.json"
                  node carenode/rename-packages.mts --selection "$WORK/reports/selection.json" --version "$VERSION"
                  node carenode/pack-packages.mts --selection "$WORK/reports/selection.json" --out "$WORK/univer-$VERSION"

            - name: Pack check
              run: |
                  node carenode/check-packs.mts --selection "$WORK/reports/selection.json" --dir "$WORK/univer-$VERSION" \
                      --version "$VERSION" | tee "$WORK/reports/pack-check.txt"
                  tail -n 1 "$WORK/reports/pack-check.txt" >> "$GITHUB_STEP_SUMMARY"

            - name: Layer 2 - compare with the official tarballs
              run: |
                  node carenode/compare-official.mts --mode fork --selection "$WORK/reports/selection.json" \
                      --built "$WORK/univer-$VERSION" --official "$WORK/official" --report "$WORK/reports/layer2.json" \
                      --version "$VERSION" | tee "$WORK/reports/layer2.txt"
                  tail -n 1 "$WORK/reports/layer2.txt" >> "$GITHUB_STEP_SUMMARY"

            - name: Upload the tarballs
              uses: actions/upload-artifact@v7
              with:
                  name: univer-${{ env.VERSION }}
                  path: ${{ env.WORK }}/univer-${{ env.VERSION }}
                  retention-days: 90
                  if-no-files-found: error

            - name: Upload the layer 2 and pack check reports
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: carenode-layer2-${{ env.VERSION }}
                  path: ${{ env.WORK }}/reports
                  retention-days: 90
                  if-no-files-found: ignore

    stage-publish:
        name: stage ${{ needs.meta.outputs.version }} on npm
        needs: [meta, upstream-build, fork-build]
        if: github.repository == 'DanMeon/univer' && needs.meta.outputs.publish == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            id-token: write
        env:
            VERSION: ${{ needs.meta.outputs.version }}
        steps:
            - name: Checkout carenode/
              uses: actions/checkout@v7
              with:
                  persist-credentials: false
                  sparse-checkout: carenode

            - name: Install pnpm and Node.js
              uses: pnpm/setup@v3
              with:
                  runtime: ${{ env.NODE_RUNTIME }}
                  install: false

            - name: Configure the npm registry (as release-npm.yml)
              uses: actions/setup-node@v7
              with:
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false

            - name: Download the tarballs
              uses: actions/download-artifact@v8
              with:
                  name: univer-${{ env.VERSION }}
                  path: ${{ runner.temp }}/univer-${{ env.VERSION }}

            - name: Stage on npm (trusted publishing)
              run: carenode/publish.sh stage "$RUNNER_TEMP/univer-$VERSION"
